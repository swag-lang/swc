<?xml version="1.0" encoding="UTF-8"?>
<!-- Swag GUI theme atlas, vector source. Each group is one tile of the 352x352
     atlas coordinate space declared by ThemeImageRects (themerects.swg): the
     theme rasterizes this document at the surface scale to rebuild the atlas
     texture. Tiles are white masks tinted at draw time by the theme colors.

     Every shape appears here exactly once. A tile is a shape, not a part: the
     round fill below serves the push button, the round edit box, the toggle, the
     progress bar, the round tool button, the slider step and the round tab bar,
     because all seven are the same circle — each of them names this one tile with
     its own nine-slice corner in themerects.swg. Two tiles with the same geometry
     are the defect this document is kept free of, so before adding one, look for
     the shape you are about to draw again.

     Holes in the coordinate space are deliberate: a tile keeps its address when a
     duplicate beside it is removed, so a rect in themerects.swg stays readable
     against this file's history. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 352">
  <!-- The round fill and its hairline. Every round control of the interface is one of
       these two, so the border weight is decided once: one authored unit, mapped 1:1
       by the nine-slice corner, which is the `wnd_BorderSize` hairline the square
       controls already draw. Three tiles used to answer for it at 1.01, 1.52 and 1.62
       units, so a push button, a round field and a toggle carried three weights. -->
