[package]
name = "swagcapture-rust"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "swagcapture-rust-preview"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
flate2 = "1"
crc32fast = "1"
arboard = "3"
rfd = { version = "0.15", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
resvg = { version = "=0.45.1", default-features = false }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
