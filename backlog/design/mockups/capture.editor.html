.tool{position:relative;display:flex;align-items:center;justify-content:center;width:48px;height:36px;color:#A9A9B4}
.tool svg{width:20px;height:20px}
.tool.on{color:#F2F2F5}
.tool.on::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:2px;background:#F7F900}
.tool.on::after{content:'';position:absolute;left:8px;right:8px;top:2px;bottom:2px;border-radius:4px;background:#1B1B21;z-index:-1}
.field{height:28px;box-sizing:border-box;border:1px solid #2A2A33;border-radius:4px;background:#131317;display:flex;align-items:center;padding:0 10px;font-size:12.5px;color:#E9E9ED}

.track{position:relative;height:2px;background:#2E2E38;border-radius:1px;flex:1}
.ro b{font-weight:400;color:#A9A9B4}
.thumb{width:96px;height:60px;border-radius:4px;flex:none;position:relative;overflow:hidden}
