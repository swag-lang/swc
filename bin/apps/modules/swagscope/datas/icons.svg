     placed in a 24-unit cell of the sheet, row by row in ViewerIcons order, and scaled by one
     and a half so it fills its cell: a glyph displayed at 16 pixels is drawn with a stroke of
     exactly 1.4 pixels, as in the GUI theme atlas. The application rasterizes this document on
     demand at any requested icon size and scale and tints it at draw time, so everything is
     white. -->
