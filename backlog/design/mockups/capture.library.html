<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Swag Capture — library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Roboto+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050506}
.win{font-family:'Inter',system-ui,sans-serif;color:#E9E9ED;-webkit-font-smoothing:antialiased}
.mono{font-family:'Roboto Mono',ui-monospace,monospace}
.ib{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;background:transparent;color:#A9A9B4;border-radius:4px;padding:0}
.ib.on{background:#15151A;color:#E9E9ED}
.ib svg,.ic{width:16px;height:16px;flex:none}
.cap{display:inline-flex;align-items:center;justify-content:center;width:46px;height:44px;border:0;background:transparent;color:#7D7D89;padding:0}
.lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#7D7D89;font-weight:600}
.menu{border:0;background:transparent;color:#C9C9D1;font:500 12.5px 'Inter',sans-serif;height:28px;padding:0 9px;border-radius:4px}
.seg{display:flex;padding:2px;gap:2px;background:#131317;border:1px solid #23232B;border-radius:6px}
.seg button{height:24px;padding:0 12px;border:0;border-radius:4px;background:transparent;color:#A9A9B4;font:500 12.5px 'Inter',sans-serif;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:#24242C;color:#F2F2F5}
.row{display:flex;align-items:center;gap:8px;height:28px;padding:0 12px 0 16px;font-size:12.5px;color:#C9C9D1;border-radius:4px;margin:0 8px}
.row.on{background:rgba(56,189,248,.13);color:#F2F2F5}
.row .n{margin-left:auto;font:11px 'Roboto Mono',monospace;color:#55555F}
.cell{display:flex;flex-direction:column;gap:8px}
.shot{aspect-ratio:16/10;border-radius:4px;position:relative;overflow:hidden}
.cell.sel .shot{box-shadow:0 0 0 2px #121216,0 0 0 4px #38BDF8}
.nm{font-size:12.5px;color:#E9E9ED;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{font:11px 'Roboto Mono',monospace;color:#7D7D89;display:flex;justify-content:space-between}
.k1{background:linear-gradient(#F4F4F2 0 12%,transparent 12%),linear-gradient(90deg,#ECECE9 0 26%,#FFFFFF 26%)}
.k2{background:linear-gradient(#0B0B0D 0 10%,transparent 10%),repeating-linear-gradient(#121216 0 9px,#121216 9px,#74AAE0 9px,#74AAE0 11px,#121216 11px,#121216 18px),#121216;background-size:auto,60% 100%,auto;background-repeat:no-repeat}
.k3{background:linear-gradient(135deg,#C98A4B,#8C5426)}
.k4{background:linear-gradient(#F4F4F2 0 12%,transparent 12%),radial-gradient(circle at 70% 60%,#E5484D 0 12%,transparent 12.5%),#FFFFFF}
.k5{background:linear-gradient(90deg,#0B0B0D 0 18%,transparent 18%),linear-gradient(#0B0B0D 0 10%,#121216 10%)}
.k6{background:linear-gradient(#22394F 0 55%,#152434 55%)}
.ro b{font-weight:400;color:#A9A9B4}
</style>
</helmet>
<div class="win" style="width:1280px;height:800px;box-sizing:border-box;background:#0B0B0D;border:1px solid #26262E;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative">
  <div aria-hidden="true" style="position:absolute;left:0;top:0;width:64px;height:3px;background:#F7F900;clip-path:polygon(0 0,100% 0,calc(100% - 3px) 100%,0 100%);z-index:2"></div>

  <header style="height:44px;flex:none;display:flex;align-items:center;background:linear-gradient(135deg,rgba(247,249,0,.055),rgba(247,249,0,0) 32%),#0B0B0D">
    <div style="display:flex;align-items:center;padding-left:16px;gap:2px">
      <svg aria-label="Swag Capture" role="img" viewBox="0 0 24 24" style="width:22px;height:22px;margin-right:12px"><path d="M8.5 4.5h7l2 2.5H21l1 1v10l-1 1H3l-1-1V8l1-1h3.5z" fill="#F7F900"/><circle cx="12" cy="13" r="4.2" fill="#0B0B0D"/><circle cx="12" cy="13" r="2.1" fill="#F7F900"/></svg>
      <button class="menu">Fichier</button><button class="menu">Capture</button><button class="menu">Édition</button><button class="menu">Image</button><button class="menu">Affichage</button>
    </div>
    <div style="flex:1"></div>
    <div class="seg" role="group" aria-label="Mode">
      <button><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 5V2h3M11 2h3v3M14 11v3h-3M5 14H2v-3"/></svg>Éditeur</button>
      <button class="on"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>Bibliothèque</button>
    </div>
    <div style="flex:1"></div>
    <div style="display:flex;align-items:center;gap:4px;padding-right:12px">
      <label style="display:flex;align-items:center;gap:8px;width:200px;height:28px;box-sizing:border-box;padding:0 10px;background:#131317;border:1px solid #23232B;border-radius:4px;margin-right:4px">
        <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="#7D7D89" stroke-width="1.4" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="m10.25 10.25 3.5 3.5"/></svg>
        <input aria-label="Rechercher" placeholder="Rechercher" style="flex:1;min-width:0;background:transparent;border:0;outline:0;color:#F2F2F5;font:13px 'Inter',sans-serif">
      </label>
      <button class="ib" aria-label="Affichage"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg></button>
      <button class="ib on" aria-label="Filtre"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 3.5h12M4.5 8h7M7 12.5h2"/></svg></button>
      <span aria-hidden="true" style="width:1px;height:16px;background:#23232B;margin:0 6px"></span>
      <div style="display:flex;align-items:stretch;height:28px;border-radius:4px;overflow:hidden;margin-right:4px">
        <button style="display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:0;background:#F7F900;color:#0B0B0D;font:600 12.5px 'Inter',sans-serif"><svg viewBox="0 0 16 16" style="width:14px;height:14px" fill="none" stroke="#0B0B0D" stroke-width="1.6" aria-hidden="true"><path d="M2 5V2h3M11 2h3v3M14 11v3h-3M5 14H2v-3"/></svg>Capturer une zone</button>
        <button aria-label="Autres captures" style="width:26px;border:0;border-left:1px solid rgba(11,11,13,.25);background:#F7F900;display:inline-flex;align-items:center;justify-content:center"><svg viewBox="0 0 16 16" style="width:12px;height:12px" fill="none" stroke="#0B0B0D" stroke-width="1.8" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
      </div>
      <button class="ib" aria-label="Apparence"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.75"/><path d="M8 2.25v11.5A5.75 5.75 0 0 0 8 2.25z" fill="currentColor"/></svg></button>
    </div>
    <div style="display:flex">
      <button class="cap" aria-label="Réduire"><svg viewBox="0 0 10 10" style="width:10px;height:10px" stroke="currentColor"><path d="M0 5.5h10"/></svg></button>
      <button class="cap" aria-label="Agrandir"><svg viewBox="0 0 10 10" style="width:10px;height:10px" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="9" height="9" rx="1.5"/></svg></button>
      <button class="cap" aria-label="Fermer"><svg viewBox="0 0 10 10" style="width:10px;height:10px" stroke="currentColor"><path d="m.5.5 9 9m0-9-9 9"/></svg></button>
    </div>
  </header>

  <div style="flex:1;display:flex;min-height:0">
    <aside style="width:240px;flex:none;display:flex;flex-direction:column;gap:4px;padding-top:12px;box-sizing:border-box">
      <div style="padding:0 16px 0 24px;height:28px;display:flex;align-items:center"><span class="lbl">Bibliothèque</span></div>
      <div class="row on">Tous les éléments<span class="n" style="color:#7DD3FC">128</span></div>
      <div class="row">Sans image liée<span class="n">41</span></div>
      <div class="row">Notés<span class="n">17</span></div>
      <div style="padding:0 16px 0 24px;height:28px;display:flex;align-items:center;margin-top:20px"><span class="lbl">Dossiers</span></div>
      <div class="row"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="#7D7D89" stroke-width="1.4" aria-hidden="true"><path d="M1.75 3.25h4.5l1.5 1.5h6.5v8H1.75z"/></svg>Documentation<span class="n">52</span></div>
      <div class="row"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="#7D7D89" stroke-width="1.4" aria-hidden="true"><path d="M1.75 3.25h4.5l1.5 1.5h6.5v8H1.75z"/></svg>Anomalies<span class="n">23</span></div>
      <div class="row"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="#7D7D89" stroke-width="1.4" aria-hidden="true"><path d="M1.75 3.25h4.5l1.5 1.5h6.5v8H1.75z"/></svg>Maquettes<span class="n">12</span></div>
      <div style="padding:0 16px 0 24px;height:28px;display:flex;align-items:center;margin-top:20px"><span class="lbl">Étiquettes</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 0 24px">
        <span class="mono" style="font-size:11px;color:#C9C9D1;background:#15151A;border-radius:4px;padding:3px 8px">scope</span>
        <span class="mono" style="font-size:11px;color:#C9C9D1;background:#15151A;border-radius:4px;padding:3px 8px">vault</span>
        <span class="mono" style="font-size:11px;color:#0B0B0D;background:#38BDF8;border-radius:4px;padding:3px 8px">gui</span>
        <span class="mono" style="font-size:11px;color:#C9C9D1;background:#15151A;border-radius:4px;padding:3px 8px">dpi</span>
        <span class="mono" style="font-size:11px;color:#C9C9D1;background:#15151A;border-radius:4px;padding:3px 8px">thème</span>
      </div>
    </aside>

    <main style="flex:1;min-width:0;background:#121216;box-shadow:inset 1px 1px 0 #1C1C23;overflow:hidden;padding:24px;box-sizing:border-box">
      <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:20px;row-gap:24px">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="15">
          <div class="{{it.cell}}">
            <div class="{{it.shot}}"></div>
            <div><div class="nm">{{it.name}}</div><div class="mt"><span>{{it.date}}</span><span>{{it.size}}</span></div></div>
          </div>
        </sc-for>
      </div>
    </main>
  </div>

  <footer class="mono" style="height:28px;flex:none;display:flex;align-items:center;font-size:11px;color:#7D7D89;background:#0B0B0D">
    <div style="width:240px;flex:none;padding-left:24px;box-sizing:border-box" class="ro">Bibliothèque</div>
    <div style="flex:1;display:flex;align-items:center;gap:20px;padding-left:24px" class="ro">
      <span><b>128</b> éléments</span>
      <span><b>1</b> sélectionné</span>
      <span>étiquette <b>gui</b></span>
    </div>
    <div style="display:flex;align-items:center;gap:20px;padding-right:16px" class="ro">
      <span>Tri <b>date ↓</b></span>
      <span>Vignettes <b>moyennes</b></span>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      ['panneau-latéral', '28/10', '1280×800', 'k1'],
      ['lexer-swag', '28/10', '960×540', 'k2'],
      ['dune-affiche', '27/10', '800×500', 'k3'],
      ['bulle-erreur', '27/10', '1280×800', 'k4'],
      ['explorateur-sombre', '26/10', '1440×900', 'k5'],
      ['heat-vignette', '26/10', '640×400', 'k6'],
      ['fiche-film', '25/10', '1280×800', 'k5'],
      ['dialogue-mdp', '25/10', '720×480', 'k1'],
      ['hex-png', '24/10', '1280×800', 'k2'],
      ['menu-joint', '24/10', '480×300', 'k4'],
      ['options-capture', '23/10', '800×600', 'k1'],
      ['dpi-150', '23/10', '1920×1200', 'k5'],
      ['palette-papier', '22/10', '1280×800', 'k1'],
      ['microcode-o2', '22/10', '1500×900', 'k2'],
      ['coffre-ouvert', '21/10', '720×905', 'k6']
    ];
    return { items: rows.map(function (r, i) {
      return { name: r[0] + '.png', date: r[1], size: r[2], shot: 'shot ' + r[3], cell: 'cell' + (i === 3 ? ' sel' : '') };
    }) };
  }
}
</script>
</body>
</html>
